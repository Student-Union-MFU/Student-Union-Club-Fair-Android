[versions]
agp = "9.2.1"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"
backdrop = "2.0.0"
zxing = "3.5.4"
camerax = "1.5.0"
datastore = "1.2.1"
coroutines = "1.10.2"
okhttp = "5.4.0"
serialization = "1.11.0"
credentials = "1.6.0"
googleid = "1.2.0"
coil = "3.5.0"
desugar = "2.1.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# `viewModel()` in a composable, and `collectAsStateWithLifecycle` so a screen
# stops collecting when it goes to the background instead of on recomposition.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
# Liquid glass — real refraction through the pane, not just a blur. Kyant0's
# AndroidLiquidGlass. minSdk 21: the blur needs API 31 and the refraction API 33,
# and the library no-ops each below those rather than crashing, so the bar
# degrades to a plain translucent pill on older phones.
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
# QR encode *and* decode: the pass renders its own module grid so it can be
# styled, and the scanner runs the same library over camera frames.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Camera for the scanner. camera-view carries PreviewView, which handles the
# surface, rotation and scale work that a raw SurfaceView would leave to us.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# On-device storage for the session and the student's own scan progress.
# Preferences rather than Proto: what's stored is a flat handful of scalars and
# a set of booth numbers, which is exactly what Preferences is for — a Proto
# schema would be ceremony around five keys.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# HTTP. OkHttp and kotlinx.serialization directly, without Retrofit: the API is
# a dozen endpoints, and su-server answers failures as `{"error": "<Thai>"}` with
# a meaningful status. Surfacing those messages through Retrofit needs a custom
# converter and error-body parsing anyway, so the abstraction would earn nothing
# and hide where the mapping happens. See `ClubFairApi`.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# Google sign-in. Credential Manager is the current API — the old
# GoogleSignInClient is deprecated — and `googleid` carries the Google ID option
# it needs to request an ID token for su-server to verify.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Remote images. There is exactly one in the app — the Google account photo,
# which arrives on the credential as a googleusercontent.com URL — and
# everything else is a bundled drawable. That is a thin reason for a library
# until you write the alternative: an off-main-thread fetch, a bitmap cache
# bounded by memory, disk persistence so the avatar survives a cold start
# offline, and cancellation when the row scrolls away. `coil-network-okhttp`
# rather than the Ktor engine so it goes through the app's own client and
# connection pool instead of standing up a second HTTP stack — see
# `ClubFairApplication`.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# java.time on API 24. The app's floor is 24 and java.time arrived in 26, so
# without this `Instant.parse` on a server timestamp crashes on Android 7 — which
# lint caught rather than a user. See coreLibraryDesugaring in the app build file.
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
